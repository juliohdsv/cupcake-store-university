services:
  - type: web
    name: doce-afeto-cupcakes
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm run start:combined
    healthCheckPath: /api/v1/health
    disk:
      name: cupcakes-sqlite
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /opt/render/project/src/storage/cupcakes.sqlite
      - key: ADMIN_SESSION_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: OFFICIAL_ADMIN_USERNAME
        value: engenheiro
      - key: OFFICIAL_ADMIN_PASSWORD
        sync: false
